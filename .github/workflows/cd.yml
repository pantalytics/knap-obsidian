# A merge to main that bumps the version publishes the plugin.
#
# The community catalog is the only way the plugin is installed (vault
# ADR-0104 in odoo-mcp-pro-admin). It reads manifest.json off main to decide
# which version is the latest and installs the files from the release tagged
# exactly that, so the version lives in git: `npm version patch`, merge, and
# this publishes a release for the version in manifest.json when it has none
# yet. A merge that does not bump the version publishes nothing.
#
# The server URL is baked in at build time from the repository variable
# KNAP_SERVER_URL, because no screen offers a server field and never will
# (ADR-0033: one server, and the plugin knows only that one).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two releases at once: both would try to publish the same tag.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: "Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fail here, loudly, rather than shipping a build whose switch stayed
      # empty. An empty KNAP_SERVER_URL is exactly the build this file
      # replaced: it looks fine and registers nothing.
      - name: The one server this build talks to
        env:
          URL: ${{ vars.KNAP_SERVER_URL }}
        run: |
          [ -n "$URL" ] || { echo "::error::vars.KNAP_SERVER_URL is not set. Repo Settings, Variables, Actions."; exit 1; }
          case "$URL" in
            https://*) ;;
            *) echo "::error::KNAP_SERVER_URL must be https. Got '$URL'"; exit 1;;
          esac
          case "$URL" in
            */) echo "::error::KNAP_SERVER_URL must not end in a slash. Got '$URL'"; exit 1;;
          esac
          echo "Building against $URL"

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # The same checks that gate a pull request, because a dispatch with an
      # older sha skips the pull request entirely, and a release nobody can
      # install is worse than no release.
      - name: Lint, type-check and test
        run: |
          npm run lint
          npx tsc --noEmit --skipLibCheck
          npx jest --forceExit --passWithNoTests

      - name: Build with the switch set
        env:
          KNAP_SERVER_URL: ${{ vars.KNAP_SERVER_URL }}
        run: npm run build

      - name: Prove the switch actually landed in the bundle
        # A build where the define silently stayed empty is a build that looks
        # fine and does nothing, which is the one failure worth catching here.
        env:
          URL: ${{ vars.KNAP_SERVER_URL }}
        run: |
          grep -qF "$URL" main.js || {
            echo "::error::main.js does not carry $URL. The define did not take."
            exit 1
          }

      # One server, one address (ADR-0033). A second Knap host in the bundle is
      # how the "You're offline" banner appeared over a syncing vault: the
      # health poll kept asking cp.knap.pantalytics.com long after the server
      # had moved. A release carrying two addresses cannot be told apart from a
      # working one by looking at it, so it is caught here instead.
      - name: Prove the bundle carries exactly one Knap address
        env:
          URL: ${{ vars.KNAP_SERVER_URL }}
        run: |
          hosts=$(grep -oE 'https://[a-z0-9.-]*pantalytics\.com' main.js | sort -u)
          if [ "$hosts" != "$URL" ]; then
            echo "::error::main.js names more than the one server. Found:"
            echo "$hosts"
            exit 1
          fi

      # The version is manifest.json's. A release that already exists means
      # this push did not bump it, and there is nothing to publish.
      - name: Work out the version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $TAG"
          fi

      - name: Attest build provenance
        if: steps.tag.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish the release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ vars.KNAP_SERVER_URL }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSETS="main.js manifest.json"
          [ -f styles.css ] && ASSETS="$ASSETS styles.css"
          # --target pins the tag to the commit that was checked out and
          # built, which on a dispatch is not the tip of main.
          gh release create "$TAG" $ASSETS \
            --title "$TAG" \
            --notes "Built from $(git rev-parse --short HEAD), pointing at $URL." \
            --target "$(git rev-parse HEAD)"
          echo "### Published: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
